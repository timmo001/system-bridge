---
# Tool releases System Bridge was last reviewed against. The tooling-drift
# tool (mise run tooling:status / tooling:publish) compares each with the
# latest release and opens a pull request for review when it moves; its
# README documents this file.
#
# PipeWire and PulseAudio (pw-dump, pactl --format=json, including list
# sink-inputs, set-sink-input-volume and move-sink-input, and pactl subscribe in
# data/module/audio and data/module/system) and the Wayland protocols the
# desktop and system modules speak (wlr-foreign-toplevel-management,
# ext-workspace, ext-idle-notify) are released on GitLab, which the tool can't
# follow, so check those by hand. The media module speaks the MPRIS D-Bus
# spec (data/module/media), which freedesktop.org changes rarely and doesn't
# release.
assignee: timmo001
dispatch:
  - lint-general.yml
  - home-assistant-frontend.yml
tools:
  - repo: home-assistant/core
    reviewed: 2026.10.4
    review: Bring the Python connector in line with Core's pyproject.toml at the new tag (requires-python, the aiohttp pin and the Ruff and pylint rules connector/python/pyproject.toml copies), and check homeassistant/components/system_bridge for calls into the connector that changed or that it no longer supports. Then check the TODO(Core) comments in client/home-assistant/frontend/src (pages.ts and sections.ts) against the entities the release adds. Uncomment a page or add to a section once its entities exist, and gate the new translation keys at this release in release.ts's RELEASE_GATES. Raise MINIMUM_RELEASE there when the dashboard starts to need a newer release. Also check registry.ts's ITEM_RULES against changed unique ID keys and translation keys in sensor.py, and its use of the config/entity_registry/list command.
  - repo: home-assistant/frontend
    reviewed: "20261028.2"
    prereleases: true
    review: Check the dashboard, view and section strategies in client/home-assistant/frontend against changes to the strategy API in src/panels/lovelace/strategies (get-strategy.ts and types.ts, registryDependencies, getConfigElement, getCreateSuggestions and window.customStrategies), the heading, tile, history-graph and entity badge config built in src/cards.ts and src/sections.ts, the tile features they use (bar-gauge, media-player-playback and media-player-volume-slider), and the ha-form selectors in src/editor.ts. Note new built-in strategies, such as the device section strategy, that could replace a generated section.
  - repo: omacom/omarchy
    reviewed: v4.5.0-rc2
    prereleases: true
    review: Check the Omarchy plugin under omarchy-plugin/, the desktop module's Omarchy shell IPC, menus and panels in data/module/desktop (omarchy_linux.go, actions_linux.go), and the Omarchy tools the command prefabs run in utils/handlers/command/prefab/prefab.go (omarchy-system-lock, omarchy-system logout, omarchy-launch-terminal, omarchy-launch-nautilus, and omasnap with OMASNAP_SCREENSHOT_DIR and its fullscreen, windows and region modes). Also check data/module/system/keep_awake_linux.go, which runs omarchy-toggle-idle stay-awake, allow-idle and status, and reads enabled from the status JSON. Omarchy decides which Hyprland System Bridge must still support. Once the release ships Hyprland 0.57 or newer, remove the pre-0.57 support in data/module/desktop and the command prefabs - the TODO(Omarchy) fallbacks, the classic forms of each hyprlandCommand, the keyword request, the onHyprlandLua probe and hyprctl dispatch exit candidate, and the workspace ID fallback in hyprlandWorkspaceRef.key.
  - repo: hyprwm/Hyprland
    reviewed: v0.57.0
    review: Check the desktop module's Hyprland IPC in data/module/desktop (hyprland_linux.go for the instance discovery, .socket.sock and .socket2.sock and the batched j/ requests; hyprland_build_linux.go for the version, configerrors, globalshortcuts, binds and status replies it decodes; desktop_linux.go for the socket2 events it listens to, such as configreloaded; actions_linux.go for the dispatchers it sends in both the Lua and classic config forms, and the reload request) against changed socket paths, request names, event names, JSON fields and dispatchers. Also check the Hyprland tools the command prefabs run in utils/handlers/command/prefab/prefab.go (hyprctl dispatch 'hl.dsp.exit()' with a Lua config or hyprctl dispatch exit, grimblast save screen, active and area, and hyprshot's window and region modes).
  - repo: OpenAsar/arrpc
    reviewed: 3.7.0
    review: A proxy for Discord's local RPC over IPC, which has no releases of its own. Read the arRPC release notes, then Discord's RPC page (developers/topics/rpc.mdx in discord/discord-api-docs) for anything changed since the last review, and check discord/ (ipc.go and dial_*.go for the socket and framing, discord.go for AUTHORIZE, AUTHENTICATE, SUBSCRIBE and the GET_* commands and events it decodes, control.go for SET_VOICE_SETTINGS, auth.go for the OAuth2 token exchange) against changed commands, events, fields and scopes.
  - repo: rockowitz/ddcutil
    reviewed: v3.0.2
    review: Check the DDC/CI display controls in data/module/displays/controls_linux.go, which run ddcutil with --skip-ddc-checks, --bus and --noverify, and parse the --brief output of detect and of getvcp for VCP 10 (brightness) and D6 (power mode) in parseDetect, parseBrightness and parsePowerState, against changed flags, output formats and exit codes.
  - repo: quickshell-mirror/quickshell
    reviewed: v0.3.2
    review: Check the Omarchy shell calls in data/module/desktop/omarchy_linux.go, which fall back to qs ipc -n -p <shell> call <target> <function> and list targets with qs ipc -n -p <shell> show, parsing its target and function lines with the ipcTarget and ipcFunction patterns in omarchyTargets, against changed flags, output and exit codes.
  - repo: bluez/bluez
    reviewed: "5.87"
    review: Check the Bluetooth module's D-Bus use in data/module/bluetooth (bluetooth_linux.go reads org.bluez Adapter1 and Device1 through ObjectManager.GetManagedObjects; watch_linux.go follows PropertiesChanged, InterfacesAdded and InterfacesRemoved; actions_linux.go calls Device1.Connect and Disconnect, Adapter1.RemoveDevice and sets Adapter1.Powered) against changed interfaces, methods, properties and errors.
  - repo: rpm-software-management/dnf5
    reviewed: 5.4.6.0
    review: Check the Fedora package checks. data/module/system/updates_linux.go runs dnf --quiet check-update with LC_ALL=C, takes exit code 100 as updates waiting, counts its three-field lines and stops at the Obsoleting section. data/module/system/system_linux.go runs dnf --disablerepo=* needs-restarting --reboothint and reads exit code 1 with "Reboot is required". Check both against changed commands, flags, output and exit codes.
  - repo: flatpak/xdg-desktop-portal
    reviewed: 1.22.1
    review: Check the screenshot prefab's built-in in utils/handlers/command/prefab/screenshot_linux.go, which calls org.freedesktop.portal.Screenshot.Screenshot with interactive false, waits for org.freedesktop.portal.Request.Response and reads its uri, against changed methods, options, response codes and results.
  - repo: swaywm/sway
    reviewed: "1.12"
    review: Check the keyboard layouts in data/module/desktop/keyboard_compositor_linux.go, which use Sway's IPC through SWAYSOCK or sway-ipc.*.sock, GET_INPUTS for each keyboard's xkb_layout_names and xkb_active_layout_index, RUN_COMMAND with input type:keyboard xkb_switch_layout, and the input event subscription's xkb_layout, xkb_keymap, added and removed changes, against changed message types, fields and commands.
  - repo: YaLTeR/niri
    reviewed: v26.04
    review: Check the keyboard layouts in data/module/desktop/keyboard_compositor_linux.go, which use niri's IPC through NIRI_SOCKET or niri.*.sock, the KeyboardLayouts request and its names and current_idx, the SwitchLayout action with an Index, and the EventStream's KeyboardLayoutsChanged and KeyboardLayoutSwitched events, against changed requests, actions, replies and events.
  - repo: microsoft/winget-cli
    reviewed: v1.29.380
    review: Check the Windows package update count in data/module/system/updates_windows.go, which runs winget upgrade --accept-source-agreements --disable-interactivity, counts the rows of its first table in wingetTableRows, and takes exit code 0x8A150014 (APPINSTALLER_CLI_ERROR_NO_APPLICATIONS_FOUND) as no updates, against changed flags, table layout, progress output and exit codes.
