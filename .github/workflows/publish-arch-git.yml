---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - mise.toml
      - LICENSE
      - web-client/**
      - .resources/**
      - .scripts/linux/PKGBUILD.dev
      - .scripts/linux/system-bridge.desktop
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (system-bridge-git)
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
    with:
      package-name: system-bridge-git
      pkgbuild-path: .scripts/linux/PKGBUILD.dev
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
