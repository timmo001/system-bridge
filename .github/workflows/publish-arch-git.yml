---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - mise.toml
      - LICENSE
      - client/web/**
      - connector/typescript/src/**
      - package.json
      - bun.lock
      - .resources/**
      - .scripts/linux/PKGBUILD.dev
      - .scripts/linux/system-bridge.desktop
      - .scripts/linux/60-system-bridge-rapl.rules
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (system-bridge-git)
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
    with:
      package-name: system-bridge-git
      pkgbuild-path: .scripts/linux/PKGBUILD.dev
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
