---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - mise.toml
      - LICENSE
      - web-client/**
      - tui/**
      - .resources/**
      - .scripts/linux/PKGBUILD.dev
      - .scripts/linux/system-bridge.desktop
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (system-bridge-git)
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@ff1183decb99b9bd7cea4fe7f1ce6c8f5f10f43b # master
    with:
      package-name: system-bridge-git
      pkgbuild-path: .scripts/linux/PKGBUILD.dev
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
