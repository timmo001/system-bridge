---
name: Fallow web client

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Fallow on changed files
        if: github.event_name != 'workflow_dispatch'
        uses: fallow-rs/fallow@017658ea7af7473dcc87c921a092f0bd507457fd # v2
        with:
          root: .
          format: sarif
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Run Fallow full scan
        if: github.event_name == 'workflow_dispatch'
        uses: fallow-rs/fallow@017658ea7af7473dcc87c921a092f0bd507457fd # v2
        with:
          root: .
          format: sarif
