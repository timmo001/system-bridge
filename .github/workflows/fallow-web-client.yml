---
name: Fallow web client

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Run Fallow on changed files
        if: github.event_name != 'workflow_dispatch'
        uses: fallow-rs/fallow@eaeb0634af797a69bae7600d2020dd99b33402ad # v2
        with:
          root: .
          format: sarif
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Run Fallow full scan
        if: github.event_name == 'workflow_dispatch'
        uses: fallow-rs/fallow@eaeb0634af797a69bae7600d2020dd99b33402ad # v2
        with:
          root: .
          format: sarif
