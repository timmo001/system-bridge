---
name: Fallow web client

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "web-client/**"
      - ".fallowrc.json"
      - ".github/workflows/fallow-web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run Fallow on changed files
        if: github.event_name != 'workflow_dispatch'
        uses: fallow-rs/fallow@6e1a3db21cdeed9e0a83376e283d7adb4a4c9805 # v2
        with:
          root: .
          format: sarif
          changed-since: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Run Fallow full scan
        if: github.event_name == 'workflow_dispatch'
        uses: fallow-rs/fallow@6e1a3db21cdeed9e0a83376e283d7adb4a4c9805 # v2
        with:
          root: .
          format: sarif
