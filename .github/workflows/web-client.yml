---
name: Web client

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "client/web/**"
      - "connector/typescript/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/web-client.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "client/web/**"
      - "connector/typescript/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: client/web
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, format check and build web client
        working-directory: client/web
        run: bun run --parallel --no-exit-on-error lint typecheck format:check build

      - name: Validate Cloudflare Workers upload
        working-directory: client/web
        run: bun run deploy --dry-run
