---
name: "Build"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-python-linux.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2
    with:
      # renovate: datasource=custom.home-assistant-python-minor depName=python
      python-version: "3.14"
