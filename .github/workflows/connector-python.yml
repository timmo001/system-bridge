---
name: Python connector

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - "connector/python/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/connector-python.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "connector/python/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/connector-python.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up runtime
        uses: ./.github/actions/setup-runtime

      - name: Lint, type check, test and build
        run: >-
          mise run -c
          lint:connector:python :::
          typecheck:connector:python :::
          test:connector:python :::
          build:connector:python
