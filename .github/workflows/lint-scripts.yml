---
name: Lint scripts

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - ".github/scripts/**"
      - ".github/workflows/lint-scripts.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/scripts/**"
      - ".github/workflows/lint-scripts.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@0a654c804d20fd738ca622e13ad1246522005b10 # master
    with:
      scandir: .github/scripts/bash

  lint-powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        env:
          # renovate: datasource=github-tags packageName=PowerShell/PSScriptAnalyzer
          PSSCRIPTANALYZER_VERSION: "1.25.0"
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path .github/scripts/pwsh -Recurse -EnableExit -Severity @('Warning', 'Error')
