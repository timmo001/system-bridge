---
name: Build and push CI Docker images

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/build-and-push-ci-image.yml
      - Dockerfile.ci-build-arch
      - Dockerfile.ci-build-ubuntu
      - mise.toml
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push CI ${{ matrix.os }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - arch
          - ubuntu
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci-build-${{ matrix.os }}
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-build-${{ matrix.os }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
