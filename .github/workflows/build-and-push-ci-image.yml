---
name: Build and push CI Docker images

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/build-and-push-ci-image.yml
      - Dockerfile.ci-build-arch
      - Dockerfile.ci-build-ubuntu
      - mise.toml
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push CI ${{ matrix.os }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - arch
          - ubuntu
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.ci-build-${{ matrix.os }}
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-build-${{ matrix.os }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
