---
name: Build and push CI Docker images

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/build-and-push-ci-image.yml
      - Dockerfile.ci-build-arch
      - Dockerfile.ci-build-ubuntu
      - mise.toml
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push CI ${{ matrix.os }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - arch
          - ubuntu
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.ci-build-${{ matrix.os }}
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-build-${{ matrix.os }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
