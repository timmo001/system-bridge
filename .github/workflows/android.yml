---
# Builds the Android app, so it and the synced Groundwork shell keep building
# with the pinned SDK, JDK and Gradle. On a stable release the shared
# publish-android-release workflow signs the APK with the shared Groundwork
# key, attaches it to the release, and adds it to the shared F-Droid
# repository on R2. Without the signing or R2 secrets, it says so and skips.
name: Android

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - client/android/**
  push:
    branches:
      - dev
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - client/android/**
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Publish the Android app for this existing stable release, such as one whose Android job failed"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app's tools are in client/android/mise.toml, which mise only reads
  # once it's trusted
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/client/android

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          working_directory: client/android
          install_args: bun android-sdk java gradle

      - name: Install the SDK packages
        working-directory: client/android
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./client/android/page

      - name: Build
        working-directory: client/android
        run: mise run app:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: system-bridge-android
          path: client/android/app/build/outputs/apk/
          if-no-files-found: error

  # Stable releases only, as with PyPI and npm, or a release tag given by hand
  # to publish one again, such as one whose release job failed
  release:
    name: Release
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
    permissions:
      contents: write
    uses: timmo001/workflows/.github/workflows/publish-android-release.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      working-directory: client/android
      mise-install-args: bun android-sdk java gradle
      setup-command: |
        android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0
        bun install --frozen-lockfile --cwd "$GITHUB_WORKSPACE" --filter ./client/android/page
      build-command: mise run app:build
      apk-path: client/android/app/build/outputs/apk/release/app-release.apk
      asset-name: system-bridge
      fdroid-directory: client/android/fdroid
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
