---
# Builds the Android app, so it and the synced Groundwork shell keep building
# with the pinned SDK, JDK and Gradle. On a stable release it signs the APK
# with the shared Groundwork key, attaches it to the release, and adds it to
# the shared F-Droid repository on R2. Without the signing or R2 secrets, the
# release steps say so and skip.
name: Android

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - client/android/**
  push:
    branches:
      - dev
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - client/android/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app's tools are in client/android/mise.toml, which mise only reads
  # once it's trusted
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/client/android

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          working_directory: client/android
          install_args: bun android-sdk java gradle

      - name: Install the SDK packages
        working-directory: client/android
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ./client/android/page

      - name: Build
        working-directory: client/android
        run: mise run app:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: system-bridge-android
          path: client/android/app/build/outputs/apk/
          if-no-files-found: error

  release:
    name: Release
    # Stable releases only, as with PyPI and npm
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Write the signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no signed APK or F-Droid repository for this release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.key.outputs.signed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        if: steps.key.outputs.signed == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          working_directory: client/android
          install_args: bun android-sdk java gradle python uv pipx:fdroidserver pipx:awscli

      - name: Install the SDK packages
        if: steps.key.outputs.signed == 'true'
        working-directory: client/android
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        if: steps.key.outputs.signed == 'true'
        run: bun install --frozen-lockfile --filter ./client/android/page

      - name: Build the signed APK
        if: steps.key.outputs.signed == 'true'
        working-directory: client/android
        run: mise run app:build

      - name: Attach the APK to the release
        if: steps.key.outputs.signed == 'true'
        run: |
          cp client/android/app/build/outputs/apk/release/app-release.apk "system-bridge-$TAG.apk"
          gh release upload "$TAG" "system-bridge-$TAG.apk" --clobber

      # The F-Droid repository at android.timmo.dev is shared with Groundwork's
      # apps, so this pulls its current state from R2, adds this release's APK
      # and listing, re-signs the index and pushes it back. Without the R2
      # secrets it's skipped.
      - name: Check for the R2 secrets
        id: r2
        if: steps.key.outputs.signed == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "::notice::No R2 secrets, so the F-Droid repository isn't updated for this release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the F-Droid repository
        if: steps.r2.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          dir="$RUNNER_TEMP/fdroid"
          mkdir -p "$dir/repo" "$dir/metadata"
          aws s3 sync "s3://$R2_BUCKET/repo/" "$dir/repo/" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3 sync "s3://$R2_BUCKET/metadata/" "$dir/metadata/" --endpoint-url "$R2_ENDPOINT" --no-progress
          cp -r client/android/fdroid/. "$dir/"
          cp "system-bridge-$TAG.apk" "$dir/repo/"
          cd "$dir"
          chmod 600 config.yml
          fdroid update --pretty
          aws s3 sync repo/ "s3://$R2_BUCKET/repo/" --endpoint-url "$R2_ENDPOINT" --no-progress \
            --exclude '*' --include '*.apk' \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync repo/ "s3://$R2_BUCKET/repo/" --endpoint-url "$R2_ENDPOINT" --no-progress \
            --exclude '*.apk' \
            --cache-control "public, max-age=60, must-revalidate"
          aws s3 sync metadata/ "s3://$R2_BUCKET/metadata/" --endpoint-url "$R2_ENDPOINT" --no-progress
