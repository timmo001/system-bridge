---
name: Setup Runtime
description: Setup pinned Go, Bun, and Node via mise

inputs:
  install_args:
    description: Tools for mise to install, such as "go bun node". Empty installs every tool in mise.toml
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Composite actions reuse this setup, so skip it once the job has it.
    # Rerunning mise-action on Windows fails when it self-updates the locked mise.exe.
    - name: Set up mise
      if: env.SYSTEM_BRIDGE_RUNTIME_READY != 'true'
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
      with:
        # CI container images already ship the tools in /mise
        cache: ${{ job.container.id == '' }}
        # Pull requests restore from dev, so only dev pushes spend time saving
        cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        install_args: ${{ inputs.install_args }}

    - name: Trust runtime config
      if: env.SYSTEM_BRIDGE_RUNTIME_READY != 'true'
      run: mise trust -a
      shell: bash

    - name: Show runtime versions
      if: env.SYSTEM_BRIDGE_RUNTIME_READY != 'true'
      run: |
        mise exec -- bun --version
        mise exec -- go version
        mise exec -- node --version
      shell: bash

    - name: Mark runtime ready
      if: env.SYSTEM_BRIDGE_RUNTIME_READY != 'true'
      run: echo "SYSTEM_BRIDGE_RUNTIME_READY=true" >> "$GITHUB_ENV"
      shell: bash
