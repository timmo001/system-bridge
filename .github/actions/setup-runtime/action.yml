---
name: Setup Runtime
description: Setup pinned Go, Bun, and Node via mise

runs:
  using: "composite"
  steps:
    - name: Set up mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
      with:
        cache: true

    - name: Trust runtime config
      run: mise trust -a
      shell: bash

    - name: Show runtime versions
      run: |
        mise exec -- bun --version
        mise exec -- go version
        mise exec -- node --version
      shell: bash
