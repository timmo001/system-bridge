---
name: Setup Runtime
description: Setup pinned Go and Bun via mise

runs:
  using: "composite"
  steps:
    - name: Set up mise
      uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
      with:
        cache: true

    - name: Trust runtime config
      run: mise trust -a
      shell: bash

    - name: Show runtime versions
      run: |
        mise exec -- bun --version
        mise exec -- go version
      shell: bash
