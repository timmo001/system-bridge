---
name: Setup Runtime
description: Setup pinned Go, Bun, and Node via mise

runs:
  using: "composite"
  steps:
    - name: Set up mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      with:
        cache: true

    - name: Trust runtime config
      run: mise trust -a
      shell: bash

    - name: Show runtime versions
      run: |
        mise exec -- bun --version
        mise exec -- go version
        mise exec -- node --version
      shell: bash
