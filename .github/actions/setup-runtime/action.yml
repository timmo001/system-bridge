---
name: Setup Runtime
description: Setup pinned Go, Bun, and Node via mise

runs:
  using: "composite"
  steps:
    - name: Set up mise
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4
      with:
        cache: true

    - name: Trust runtime config
      run: mise trust -a
      shell: bash

    - name: Show runtime versions
      run: |
        mise exec -- bun --version
        mise exec -- go version
        mise exec -- node --version
      shell: bash
