min_version = "2025.1.0"

[tools]
bun = "1.4.4"
go = "1.27.3"
node = "26.12.1"
"npm:@timmo001/tooling-drift" = { version = "0.1.4", allow_low_downloads = true }
# renovate: datasource=custom.home-assistant-python-minor depName=python
python = "3.14"
uv = "0.13.5"

# Tasks replace the old Makefile. Run them with `mise run <task>` (or `mise <task>`).
# List everything with `mise tasks`. Tools pinned in [tools] are on PATH inside
# every task, so commands call `go`/`bun`/`bunx` directly (no `mise exec --`).
# Naming: `verb:all` is the full aggregate, `verb:<target>` is a single component.

[tasks."build:all"]
description = "Build everything (web client, backend)"
depends = ["build:client:web"]
run = "go build -v -ldflags=\"-X 'github.com/timmo001/system-bridge/version.Version=$(git describe --tags --abbrev=0)'\" -o system-bridge-linux ."
run_windows = [
  "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/generate-rc.ps1",
  "windres system-bridge.rc -O coff -o system-bridge.syso",
  "go build -v -ldflags=\"-H windowsgui -X 'github.com/timmo001/system-bridge/version.Version={{ exec(command='git describe --tags --abbrev=0') }}'\" -o system-bridge.exe .",
]

[tasks."build:console"]
description = "Build console version for debugging (Windows only)"
depends = ["build:client:web"]
run = "echo 'Console build is only supported on Windows'"
run_windows = "go build -v -ldflags=\"-X 'github.com/timmo001/system-bridge/version.Version={{ exec(command='git describe --tags --abbrev=0') }}'\" -o system-bridge-console.exe ."

[tasks."install:js"]
description = "Install the Bun workspace dependencies (connector, web client and docs)"
run = "bun install --frozen-lockfile"

[tasks."generate:schemas"]
description = "Generate Effect schemas from Go types"
depends = ["install:js"]
sources = ["types/**/*.go", "tools/generate-schemas/**/*.go"]
outputs = ["connector/typescript/src/generated/modules.ts"]
run = [
  "go run ./tools/generate-schemas",
  "cd connector/typescript && bunx prettier --write src/generated/modules.ts",
]

[tasks."drift:connectors"]
description = "Compare the Python and TypeScript connectors with the backend before a release"
depends = ["generate:schemas"]
# The TypeScript module data schemas are generated, so they're in sync once
# regenerating them changes nothing
run = [
  "git diff --exit-code --stat -- connector/typescript/src/generated/modules.ts",
  "go run ./tools/check-connector-drift",
]

[tasks."generate:icons"]
description = "Generate every icon from .resources/system-bridge-logo.svg, then the docs' brand images"
depends = ["install:js"]
run = ["bun .scripts/generate-icons.ts", "cd docs && bun run brand"]

[tasks."build:client:web"]
description = "Build the web client"
depends = ["generate:schemas"]
sources = [
  "client/web/src/**/*",
  "client/web/public/**/*",
  "client/web/index.html",
  "client/web/package.json",
  "bun.lock",
  "connector/typescript/package.json",
  "connector/typescript/src/**/*.ts",
  "client/web/tsconfig.json",
  "client/web/vite.config.ts",
]
outputs = ["client/web/dist/index.html"]
run = '''
(cd client/web && bun run build)
echo "Verifying build files are accessible..."
if ! ls client/web/dist/index.html >/dev/null 2>&1; then
	echo "ERROR: client/web/dist/index.html not found"
	exit 1
fi
if ! ls client/web/dist/assets/*.css >/dev/null 2>&1; then
	echo "ERROR: CSS files not found in client/web/dist/assets/"
	ls -la client/web/dist/assets/ || true
	exit 1
fi
if ! ls client/web/dist/assets/*.js >/dev/null 2>&1; then
	echo "ERROR: JS files not found in client/web/dist/assets/"
	ls -la client/web/dist/assets/ || true
	exit 1
fi
echo "Verifying the design tokens are in the CSS..."
CSS_FILE=$(find client/web/dist/assets -name "*.css" -type f 2>/dev/null | head -1)
if [ -z "$CSS_FILE" ]; then
	echo "ERROR: No CSS file found to verify"
	exit 1
fi
if ! grep -q -- "--sb-color-" "$CSS_FILE" 2>/dev/null; then
	echo "ERROR: The CSS has no --sb-color-* design tokens"
	echo "Check client/web/src/styles/tokens.css is imported by src/app.ts"
	exit 1
fi
echo "  ✓ Found the design tokens"
echo "✓ Build files verified and ready for embedding"
'''
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/build-web-client.ps1"

[tasks."package:all"]
description = "Build all Linux packages (DEB, RPM, Arch, Flatpak)"
depends = ["clean:dist", "build:all"]
run = '''
echo "Packaging all Linux formats in parallel..."
chmod +x ./.scripts/linux/create-deb.sh ./.scripts/linux/create-rpm.sh ./.scripts/linux/create-arch.sh ./.scripts/linux/create-flatpak.sh
VERSION="5.0.0-dev+$(git rev-parse --short HEAD)" ./.scripts/linux/create-deb.sh &
VERSION="5.0.0-dev+$(git rev-parse --short HEAD)" ./.scripts/linux/create-rpm.sh &
VERSION="5.0.0-dev+$(git rev-parse --short HEAD)" ./.scripts/linux/create-arch.sh &
VERSION="5.0.0-dev+$(git rev-parse --short HEAD)" ./.scripts/linux/create-flatpak.sh &
wait
'''
run_windows = "echo 'package:all is only supported on Linux hosts'"

[tasks."package:arch"]
description = "Create Arch Linux package"
depends = ["clean:dist"]
run = "VERSION=\"5.0.0-dev+$(git rev-parse --short HEAD)\" ./.scripts/linux/create-arch.sh"

[tasks."package:flatpak"]
description = "Create Flatpak package"
depends = ["clean:dist"]
run = "VERSION=\"5.0.0-dev+$(git rev-parse --short HEAD)\" ./.scripts/linux/create-flatpak.sh"

[tasks."package:deb"]
description = "Create Debian package"
depends = ["clean:dist"]
run = "VERSION=\"5.0.0-dev+$(git rev-parse --short HEAD)\" ./.scripts/linux/create-deb.sh"

[tasks."package:rpm"]
description = "Create RPM package"
depends = ["clean:dist"]
run = "VERSION=\"5.0.0-dev+$(git rev-parse --short HEAD)\" ./.scripts/linux/create-rpm.sh"

[tasks."package:windows-installer"]
description = "Create Windows installer"
depends = ["clean:dist", "download:now-playing"]
run = "echo 'Creating the Windows installer is only supported on Windows'"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/create-installer.ps1 /Clean"

[tasks."download:now-playing"]
description = "Download the Windows NowPlaying helper (Windows only)"
run = "echo 'Downloading the NowPlaying helper is only supported on Windows'"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/download-now-playing.ps1"

[tasks.install]
description = "Install the application with go install"
depends = ["build:all"]
run = "go install ."

[tasks.run]
description = "Build and run the application (development only)"
depends = ["build:all"]
dir = "client/web"
run = 'bunx concurrently -n "web,backend" -c "blue,green" "bun run dev" "../../system-bridge-linux backend"'
run_windows = 'bunx concurrently -n "web,backend" -c "blue,green" "bun run dev" "../../system-bridge.exe backend"'

[tasks."run:client:web"]
description = "Run the web client dev server (Vite)"
dir = "client/web"
run = "bun run dev"

[tasks."run:backend"]
description = "Build and run the backend server"
depends = ["build:all"]
run = "./system-bridge-linux backend"
run_windows = "./system-bridge.exe backend"

[tasks."run:backend-dev"]
description = "Build and run the backend server with console output"
depends = ["build:client:web"]
run = "go build -v -ldflags=\"-X 'github.com/timmo001/system-bridge/version.Version=$(git describe --tags --abbrev=0)'\" -o system-bridge-linux . && ./system-bridge-linux backend"
run_windows = "go build -v -ldflags=\"-X 'github.com/timmo001/system-bridge/version.Version={{ exec(command='git describe --tags --abbrev=0') }}'\" -o system-bridge.exe . && ./system-bridge.exe backend"

[tasks."tooling:status"]
description = "Compare the reviewed releases in tooling.yml with the latest"
run = "tooling-drift status"

[tasks."tooling:update"]
description = "Record a tool release as reviewed in tooling.yml after reviewing it"
usage = '''
arg "<repo>" help="Tool repository, e.g. omacom/omarchy"
arg "<tag>" help="Release tag, e.g. v4.0.6"
'''
run = "tooling-drift update $usage_repo $usage_tag"

[tasks."tooling:publish"]
description = "Open or refresh a review pull request for every tool behind its latest release"
run = "tooling-drift publish"

[tasks."serve:backend"]
description = "Start the backend dev server through pitchfork"
run = "pitchfork start backend"

[tasks."serve:web"]
description = "Start the web client dev server through pitchfork"
run = "pitchfork start web"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through pitchfork"
depends = ["install:js"]
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."serve:all"]
description = "Start all pitchfork dev servers"
run = "pitchfork start -l"

[tasks."serve:status"]
description = "Show pitchfork dev server status"
run = "pitchfork status"

[tasks."serve:logs"]
description = "Follow backend dev server logs"
run = "pitchfork logs -t backend"

[tasks."serve:restart"]
description = "Restart pitchfork dev servers"
run = "pitchfork restart backend web"

[tasks."serve:stop"]
description = "Stop pitchfork dev servers"
run = "pitchfork stop backend web"

[tasks.cli]
description = "Build and run the CLI (append subcommands after --, e.g. mise run cli -- version)"
depends = ["build:all"]
run = "./system-bridge-linux cli"
run_windows = "./system-bridge.exe cli"

[tasks."run:console"]
description = "Build and run console version for debugging (Windows only)"
depends = ["build:console"]
run = "echo 'Console run is only supported on Windows'"
run_windows = "./system-bridge-console.exe backend"

[tasks."processes:list"]
description = "List running System Bridge processes (Windows only)"
run = "echo 'Process management is only supported on Windows'"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/list-processes.ps1"

[tasks."processes:stop"]
description = "Stop all running System Bridge processes (Windows only)"
run = "echo 'Process management is only supported on Windows'"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/stop-processes.ps1"

[tasks.test]
description = "Run Go tests"
depends = ["build:client:web"]
run = "go test ./..."

[tasks.check]
description = "Run all linters and tests"
depends = ["lint:all", "test", "test:connector:python", "test:connector:typescript"]

[tasks."lint:all"]
description = "Run all linters (Go, web client, Python and TypeScript connectors)"
depends = [
  "lint:go",
  "lint:client:web",
  "lint:connector:python",
  "typecheck:connector:python",
  "lint:connector:typescript",
  "typecheck:connector:typescript",
]

[tasks."lint:go"]
description = "Run Go linters (format check, vet)"
depends = ["lint:go:fmt", "lint:go:vet"]

[tasks."lint:go:fmt"]
description = "Check Go formatting without rewriting files"
run = '''
unformatted=$(gofmt -l $(git ls-files '*.go'))
if [ -n "$unformatted" ]; then
  echo "Unformatted Go files (run mise run format:go):"
  echo "$unformatted"
  exit 1
fi
'''

[tasks."lint:go:vet"]
description = "Run go vet"
depends = ["build:client:web"]
run = "go vet ./..."

[tasks."format:go"]
description = "Format Go code"
run = "go fmt ./..."

[tasks."lint:client:web"]
description = "Run web client linters (Oxlint, typecheck)"
depends = ["install:js"]
dir = "client/web"
run = "bun run --parallel --no-exit-on-error lint typecheck"

[tasks."install:connector:python"]
description = "Install the Python connector and its test requirements into connector/python/.venv"
dir = "connector/python"
sources = ["pyproject.toml", "requirements_test.txt"]
run = [
  "uv venv --allow-existing",
  "uv pip install --requirement requirements_test.txt --editable .",
]

[tasks."format:connector:python"]
description = "Fix lint issues and format the Python connector with Ruff"
depends = ["install:connector:python"]
dir = "connector/python"
run = ["uv run --no-sync ruff check --fix .", "uv run --no-sync ruff format ."]

[tasks."lint:connector:python"]
description = "Run Python connector linters (Ruff, Ruff format check, Pylint)"
depends = ["lint:connector:python:*"]

[tasks."lint:connector:python:ruff"]
description = "Lint the Python connector with Ruff"
depends = ["install:connector:python"]
dir = "connector/python"
run = "uv run --no-sync ruff check ."

[tasks."lint:connector:python:format"]
description = "Check Python connector formatting with Ruff"
depends = ["install:connector:python"]
dir = "connector/python"
run = "uv run --no-sync ruff format --check ."

[tasks."lint:connector:python:pylint"]
description = "Lint the Python connector with Pylint"
depends = ["install:connector:python"]
dir = "connector/python"
run = "uv run --no-sync pylint systembridgeconnector"

[tasks."typecheck:connector:python"]
description = "Type check the Python connector with mypy"
depends = ["install:connector:python"]
dir = "connector/python"
run = "uv run --no-sync mypy systembridgeconnector"

[tasks."test:connector:python"]
description = "Run the Python connector tests"
depends = ["install:connector:python"]
dir = "connector/python"
run = "uv run --no-sync pytest"

[tasks."build:connector:python"]
description = "Build the Python connector sdist and wheel"
dir = "connector/python"
sources = ["../../LICENSE", "pyproject.toml", "README.md", "systembridgeconnector/**"]
outputs = ["dist/*"]
# license-files can't point outside the package, so copy the root licence in
run = ["cp ../../LICENSE LICENSE", "uv build"]

[tasks."format:connector:typescript"]
description = "Format the TypeScript connector with Prettier"
depends = ["install:js"]
dir = "connector/typescript"
run = "bun run format"

[tasks."lint:connector:typescript"]
description = "Lint the TypeScript connector with Oxlint and check its formatting"
depends = ["install:js"]
dir = "connector/typescript"
run = "bun run --parallel --no-exit-on-error lint format:check"

[tasks."typecheck:connector:typescript"]
description = "Type check the TypeScript connector"
depends = ["install:js"]
dir = "connector/typescript"
run = "bun run typecheck"

[tasks."test:connector:typescript"]
description = "Run the TypeScript connector tests"
depends = ["install:js"]
dir = "connector/typescript"
run = "bun run test"

[tasks."build:connector:typescript"]
description = "Build the TypeScript connector"
depends = ["install:js"]
dir = "connector/typescript"
sources = ["../../LICENSE", "package.json", "tsconfig.json", "src/**"]
outputs = ["dist/index.js"]
run = "bun run build"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f system-bridge system-bridge-linux"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/clean.ps1"

[tasks."clean:dist"]
description = "Remove dist directory"
run = "rm -rf .flatpak-builder AppDir appimagetool build dist dist-agg rpm-structure rpmbuild flatpak-build repo deb-structure"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/clean-dist.ps1"

[tasks."clean:client:web"]
description = "Remove web client build artifacts"
run = "rm -rf client/web/dist"
run_windows = "powershell -ExecutionPolicy Bypass -File ./.scripts/windows/clean-web-client.ps1"

[tasks.deps]
description = "Install all dependencies (go, web client, docs)"
depends = ["install:js"]
run = "go mod tidy"

[tasks.version]
description = "Show the version of the application"
depends = ["build:all"]
run = "./system-bridge-linux version"
run_windows = "./system-bridge.exe version"

[tasks."docs:dev"]
description = "Run the docs site dev server (Blume)"
depends = ["install:js"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site, failing on content errors"
depends = ["install:js"]
dir = "docs"
run = "bun run build"

[tasks."docs:validate"]
description = "Check every link and anchor in the docs"
depends = ["install:js"]
dir = "docs"
run = "bun run validate"

[tasks."docs:lint"]
description = "Lint docs markdown with the docs ruleset"
dir = "docs"
run = "bunx markdownlint-cli --config .markdownlint.json \"**/*.md\""

[tasks."omarchy-plugin:test-publisher"]
description = "Test the Omarchy plugin publisher"
run = "bash .github/scripts/bash/publish-omarchy-plugin.test.sh"

[tasks."omarchy-plugin:validate"]
description = "Validate the Omarchy plugin with the installed Omarchy"
run = "omarchy plugin validate omarchy-plugin"
