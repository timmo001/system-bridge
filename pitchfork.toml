# Optional pitchfork (https://pitchfork.jdx.dev) dev-loop supervisor config.
# Install once with `mise use -g pitchfork`, then:
#   pitchfork start -l          # start every daemon defined here
#   pitchfork status            # PIDs, ports, state
#   pitchfork logs -t backend   # follow a daemon's logs
#   pitchfork stop backend      # stop
# Inert unless you run pitchfork; it does not affect builds or CI.
#
# The backend daemon stands in for the installed service, so it keeps the fixed
# port 9170 that clients expect. Pitchfork won't start a daemon whose port is
# taken, so backend-prep first stops the production systemd user unit and
# whichever process owns the port. The on_exit hook restores it.

[daemons.backend-prep]
run = ".scripts/linux/pitchfork-backend-prep.sh"
oneshot = true

[daemons.backend]
run = 'SYSTEM_BRIDGE_PORT="$PORT" exec mise run run:backend-dev'
port = 9170
depends = ["backend-prep"]
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null'

[daemons.backend.hooks]
on_exit = ".scripts/linux/pitchfork-backend-restore.sh"

[daemons.web]
# Vite dev server (hot reload) for the web client. No production counterpart.
run = 'exec mise run run:web-client --host 127.0.0.1 --port "$PORT" --strictPort'
port = { expect = [7680], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/" >/dev/null'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/" >/dev/null'
retry = true

[daemons.docs]
# Astro docs site. --ignore-lock stops Astro from detaching itself when it
# detects an agent, so pitchfork keeps hold of the server.
dir = "docs"
run = 'exec bunx astro dev --ignore-lock --host 127.0.0.1 --port "$PORT"'
port = { expect = [7660], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/" >/dev/null'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/" >/dev/null'
retry = true
